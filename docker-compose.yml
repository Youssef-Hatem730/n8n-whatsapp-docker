version: '3.8'



networks:

  automation_net:

    driver: bridge



volumes:

  postgres_data:

  n8n_data:

  evolution_instances:

  video_share:



services:

  postgres:

    image: postgres:16-alpine

    container_name: automation_db

    restart: unless-stopped  # <-- Keeps it running on system reboot

    networks:

      - automation_net

    environment:

      POSTGRES_USER: automation_user

      POSTGRES_PASSWORD: SecretPassword123

      POSTGRES_DB: automation_db

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U automation_user -d automation_db"]

      interval: 5s

      timeout: 5s

      retries: 5



  evolution-api:

    image: evoapicloud/evolution-api:latest

    container_name: evolution_api

    restart: unless-stopped  # <-- Keeps it running on system reboot

    networks:

      - automation_net

    ports:

      - "8080:8080"

    volumes:

      - evolution_instances:/evolution/instances

    environment:

    #  - SERVER_URL=http://localhost:8080

    #

      - SERVER_URL=http://evolution_api:8080

      - WEBHOOK_GLOBAL_ENABLED=true

      - AUTHENTICATION_TYPE=apikey

      - AUTHENTICATION_API_KEY=YourGlobalEvolutionApiKey123

      - DATABASE_ENABLED=true

      - DATABASE_PROVIDER=postgresql

      - DATABASE_CONNECTION_URI=postgresql://automation_user:SecretPassword123@postgres:5432/automation_db?sslmode=disable

      - DATABASE_SAVE_DATA_INSTANCE=true

      - DATABASE_SAVE_DATA_NEW_MESSAGE=true

      - CACHE_REDIS_ENABLED=false

    depends_on:
      postgres:
        condition: service_healthy




  n8n:
   # build: .
    image: n8nio/n8n:latest

    restart: unless-stopped  # <-- Keeps it running on system reboot

    networks:

      - automation_net

    ports:

      - "5678:5678"

    volumes:

      - n8n_data:/home/node/.n8n
      - ~/shared-downloads:/home/node/shared-videos
      - /home/ubuntu/.local/bin/yt-dlp:/home/ubuntu/.local/bin/yt-dlp



    extra_hosts:

      - "host.docker.internal:host-gateway"

    environment:

      - WEBHOOK_URL=http://54.243.228.192:5678/  # Replace with your actual domain or IP

      - N8N_PROXY_HOPS=1
      - YT_DLP_PATH=/home/ubuntu/.local/bin/yt-dlp

      - N8N_RUNNERS_ENABLED=true
      - DB_TYPE=postgresdb

      - N8N_COMMUNITY_PACKAGES_ENABLED=true   # must be enabled
      - NODE_FUNCTION_ALLOW_EXTERNAL=*

      - N8N_RUNNERS_MODE=externalZZ

      - N8N_RUNNERS_EXTERNAL_ALLOW=*

      - N8N_RUNNERS_AUTH_TOKEN=my_secure_secret_token_123

      - DB_POSTGRESDB_HOST=postgres

      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/shared-videos/

      - DB_POSTGRESDB_PORT=5432

      - DB_POSTGRESDB_DATABASE=automation_db

      - DB_POSTGRESDB_USER=automation_user

      - DB_POSTGRESDB_PASSWORD=SecretPassword123

      - N8N_ENCRYPTION_KEY=SuperSecretEncryptionKey123

      - N8N_SECURE_COOKIE=false

      - N8N_AUTH_METHOD=none  # <-- Disables the login screen

      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true  # <-- Prevents database volume permission errors

      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      
      #to make sure the data dont overflow
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=72 #around three days
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=1000

    depends_on:

      postgres:

        condition: service_healthy


  reddit-fetcher:
    build: ./reddit-fetcher
  
    container_name: reddit_fetcher
    restart: unless-stopped
    networks:
      - automation_net
    ports:
      - "8000:8000"

    volumes:
      
      - ./cookies.txt:/app/cookies.txt:ro
      
    environment:
      - REDDIT_CLIENT_ID=your_new_rotated_id
      - REDDIT_CLIENT_SECRET=your_new_rotated_secret

  ytdl_material:
    environment: 
        ytdl_mongodb_connection_string: 'mongodb://ytdl-mongo-db:27017'
        ytdl_use_local_db: 'false'
        write_ytdl_config: 'true'
        UID: 0
        GID: 0
    restart: unless-stopped
    depends_on:
      - ytdl-mongo-db
    volumes:
      - ./appdata:/app/appdata
      - ./audio:/app/audio
      - ./video:/app/video
      - ./subscriptions:/app/subscriptions
      - ./users:/app/users
      - ~/shared-downloads:/app/video
      - ~/shared-downloads/audio:/app/audio
    ports:
      - "8998:17442"


    networks:

      - automation_net


    #image: tzahi12345/youtubedl-material:latest
    build: .

  ytdl-mongo-db:
        # If you are using a Raspberry Pi, use mongo:4.4.18
    image: mongo:4
    logging:
      driver: "none"          
    container_name: mongo-db
    restart: always
    volumes:
      - ./db/:/data/db
    networks:

      - automation_net
 
